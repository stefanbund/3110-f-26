<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Disclosure</title>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .back-btn {
      align-self: flex-start;
      margin-bottom: 20px;
      padding: 10px 15px;
      background-color: #bb86fc;
      color: #000;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    .back-btn:hover { background-color: #9965f4; }
    
    .profile-card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
      text-align: center;
    }
    .profile-card img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #03dac6;
      margin-bottom: 20px;
    }
    .profile-card h1 {
      color: #03dac6;
      margin: 0 0 10px 0;
    }
    .profile-card p {
      font-size: 1.1rem;
      color: #ccc;
      margin: 8px 0;
    }
    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      text-align: left;
      gap: 15px;
      margin-top: 30px;
      background-color: #2c2c2c;
      padding: 20px;
      border-radius: 8px;
    }
    .data-grid div span {
      display: block;
      font-size: 0.85rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .data-grid div strong {
      font-size: 1.1rem;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Link back to our main app -->
  <a href="app7.html" class="back-btn">← Back to Directory</a>

  <div class="profile-card" id="profileOutput">
    <!-- Data will be injected here by JavaScript -->
    <p>Loading data...</p>
  </div>

  <script>
    // --- 1. CAPTURE THE URL DATA ---
    // window.location.search gets the query string part of the URL (e.g. "?firstName=Alice&lastName=Smith...")
    const queryString = window.location.search;
    console.log(queryString)
    // URLSearchParams is a built-in browser tool to easily parse these strings
    const urlParams = new URLSearchParams(queryString);

    // We can extract individual pieces of data by key
    const id = urlParams.get('customerId') || 'Unknown ID';
    const firstName = urlParams.get('firstName') || '';
    const lastName = urlParams.get('lastName') || '';
    const email = urlParams.get('email') || 'N/A';
    const phone = urlParams.get('phone') || 'N/A';
    const address = urlParams.get('address') || '';
    const city = urlParams.get('city') || '';
    const state = urlParams.get('state') || '';
    const zipCode = urlParams.get('zipCode') || '';
    const status = urlParams.get('status') || 'Unknown';
    const imageUrl = urlParams.get('imageUrl') || 'https://via.placeholder.com/150';

    // --- 2. DISPLAY THE DATA ---
    const outputContainer = document.getElementById('profileOutput');
    
    outputContainer.innerHTML = `
      <img src="${imageUrl}" alt="Profile Picture">
      <h1>${firstName} ${lastName}</h1>
      <p style="color: #bb86fc;">${id} - ${status}</p>
      
      <div class="data-grid">
        <div>
          <span>Email Address</span>
          <strong>${email}</strong>
        </div>
        <div>
          <span>Phone Number</span>
          <strong>${phone}</strong>
        </div>
        <div>
          <span>Street Address</span>
          <strong>${address}</strong>
        </div>
        <div>
          <span>Location</span>
          <strong>${city}, ${state} ${zipCode}</strong>
        </div>
      </div>
    `;
  </script>
</body>
</html>
