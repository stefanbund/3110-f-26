<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App 5 - Full CRUD (Create, Read, Update, Delete)</title>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 40px;
    }
    h1 {
      color: #bb86fc;
      text-align: center;
    }
    .instruction {
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #333;
      margin-bottom: 30px;
      text-align: center;
    }
    
    /* Shared Form Styling */
    .form-container, .modal-content {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      max-width: 800px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .form-container {
      margin: 0 auto 30px auto;
    }
    .form-container h2, .modal-content h2 {
      grid-column: 1 / -1;
      margin-top: 0;
      color: #03dac6;
      font-size: 1.2rem;
    }
    .input-group {
      display: flex;
      flex-direction: column;
    }
    .input-group label {
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #b0b0b0;
    }
    .input-group input, .input-group select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background-color: #2c2c2c;
      color: #fff;
    }
    .btn-primary {
      grid-column: 1 / -1;
      padding: 12px;
      background-color: #bb86fc;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-primary:hover {
      background-color: #9965f4;
    }
    .btn-secondary {
      grid-column: 1 / -1;
      padding: 12px;
      background-color: #555;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 5px;
    }
    .btn-secondary:hover {
      background-color: #777;
    }

    /* Customer Cards */
    #customer-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
    .customer-card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      position: relative;
    }
    .customer-card h3 {
      margin: 0 0 10px 0;
      color: #03dac6;
      font-size: 1.4rem;
    }
    .customer-card p {
      margin: 5px 0;
      color: #b0b0b0;
    }
    .status {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: bold;
    }
    .status-active { background-color: #1b5e20; color: #a5d6a7; }
    .status-inactive { background-color: #b71c1c; color: #ef9a9a; }
    .status-pending { background-color: #f57f17; color: #fff59d; }

    /* Action Buttons inside Card */
    .action-buttons {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
    }
    .edit-btn, .delete-btn {
      color: #000;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .edit-btn {
      background-color: #03dac6;
    }
    .edit-btn:hover { background-color: #018786; color: #fff; }
    .delete-btn {
      background-color: #cf6679;
    }
    .delete-btn:hover { background-color: #b33951; color: #fff; }

    /* Modal Styling */
    .modal-overlay {
      display: none; /* Hidden by default */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      /* Overrides standard form-container to remove auto margins inside the flex overlay */
      margin: 0;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <h1>Customer Directory App</h1>
  <div class="instruction">
    <p>Version 5: We have reached full CRUD! You can Create, Read, Update, and Delete customers. Try the Edit button!</p>
  </div>
  
  <!-- Add Form -->
  <div class="form-container">
    <h2>Add New Customer</h2>
    
    <div class="input-group">
      <label>Customer ID</label>
      <input type="text" id="addId" placeholder="CUST-006">
    </div>
    <div class="input-group">
      <label>Status</label>
      <select id="addStatus">
        <option value="Active">Active</option>
        <option value="Pending">Pending</option>
        <option value="Inactive">Inactive</option>
      </select>
    </div>
    <div class="input-group">
      <label>First Name</label>
      <input type="text" id="addFirstName" placeholder="Jane">
    </div>
    <div class="input-group">
      <label>Last Name</label>
      <input type="text" id="addLastName" placeholder="Doe">
    </div>
    <div class="input-group">
      <label>Email</label>
      <input type="email" id="addEmail" placeholder="jane@example.com">
    </div>
    <div class="input-group">
      <label>Phone</label>
      <input type="text" id="addPhone" placeholder="555-0199">
    </div>
    <div class="input-group">
      <label>Address</label>
      <input type="text" id="addAddress" placeholder="123 Main St">
    </div>
    <div class="input-group">
      <label>City</label>
      <input type="text" id="addCity" placeholder="Los Angeles">
    </div>
    <div class="input-group">
      <label>State</label>
      <input type="text" id="addState" placeholder="CA">
    </div>
    <div class="input-group">
      <label>Zip Code</label>
      <input type="text" id="addZipCode" placeholder="90001">
    </div>

    <button class="btn-primary" onclick="addCustomer()">Add Customer</button>
  </div>

  <!-- Dynamic List Container -->
  <div id="customer-container"></div>
  
  <!-- Edit Modal Overlay -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-content">
      <h2>Edit Customer</h2>
      
      <div class="input-group">
        <label>Customer ID</label>
        <input type="text" id="editId">
      </div>
      <div class="input-group">
        <label>Status</label>
        <select id="editStatus">
          <option value="Active">Active</option>
          <option value="Pending">Pending</option>
          <option value="Inactive">Inactive</option>
        </select>
      </div>
      <div class="input-group">
        <label>First Name</label>
        <input type="text" id="editFirstName">
      </div>
      <div class="input-group">
        <label>Last Name</label>
        <input type="text" id="editLastName">
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="editEmail">
      </div>
      <div class="input-group">
        <label>Phone</label>
        <input type="text" id="editPhone">
      </div>
      <div class="input-group">
        <label>Address</label>
        <input type="text" id="editAddress">
      </div>
      <div class="input-group">
        <label>City</label>
        <input type="text" id="editCity">
      </div>
      <div class="input-group">
        <label>State</label>
        <input type="text" id="editState">
      </div>
      <div class="input-group">
        <label>Zip Code</label>
        <input type="text" id="editZipCode">
      </div>

      <button class="btn-primary" onclick="saveEdit()">Save Changes</button>
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <script src="app5.js"></script>
</body>
</html>
