<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project 8 - Main Directory</title>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 40px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 800px;
      margin: 0 auto 30px auto;
    }
    h1 {
      color: #bb86fc;
      margin: 0;
    }
    .header-actions {
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .instruction {
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #333;
      margin-bottom: 30px;
      text-align: center;
      max-width: 760px;
      margin-left: auto;
      margin-right: auto;
    }
    
    /* Buttons */
    .btn-primary {
      padding: 10px 16px;
      background-color: #bb86fc;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-primary:hover { background-color: #9965f4; }
    
    .btn-cart {
      padding: 10px 16px;
      background-color: #03dac6;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-cart:hover { background-color: #018786; color: #fff; }
    .badge {
      background-color: #000;
      color: #03dac6;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.85rem;
    }

    .btn-add-meeting {
      padding: 8px 12px;
      background-color: #2c2c2c;
      color: #03dac6;
      border: 1px solid #03dac6;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-add-meeting:hover {
      background-color: #03dac6;
      color: #000;
    }
    
    .action-btn {
      color: #000;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .edit-btn { background-color: #aaa; }
    .delete-btn { background-color: #cf6679; }

    /* Customer Cards */
    #customer-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
    .customer-card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      position: relative;
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .customer-card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #333;
    }
    .card-content {
      flex: 1;
    }
    .customer-card h3 {
      margin: 0 0 10px 0;
      color: #bb86fc;
      font-size: 1.4rem;
    }
    .customer-card p {
      margin: 5px 0;
      color: #b0b0b0;
    }
    .card-actions {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>
  
  <div class="instruction">
    <p>Project 8: LocalStorage Shopping Cart! Click "Add to Meeting" to save users to your browser's persistent memory, then view the Meeting Space.</p>
  </div>

  <div class="header">
    <h1>Directory</h1>
    <div class="header-actions">
      <!-- The Meeting Space (Cart) Button -->
      <a href="p8-meeting.html" class="btn-cart">
        Meeting Space <span class="badge" id="meetingCount">0</span>
      </a>
    </div>
  </div>

  <div id="customer-container"></div>
  
  <script src="p8.js"></script>
</body>
</html>
