<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project 8 - Meeting Space</title>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 40px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 800px;
      margin: 0 auto 30px auto;
      border-bottom: 2px solid #333;
      padding-bottom: 20px;
    }
    h1 {
      color: #03dac6;
      margin: 0;
    }
    .back-btn {
      padding: 10px 15px;
      background-color: #555;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    .back-btn:hover { background-color: #777; }
    
    #empty-state {
      text-align: center;
      color: #888;
      font-size: 1.2rem;
      margin-top: 50px;
    }

    /* Meeting Participant Cards */
    #meeting-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .participant-card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .participant-card img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 2px solid #03dac6;
    }
    .participant-card h3 {
      margin: 0 0 5px 0;
      color: #fff;
    }
    .participant-card p {
      margin: 0 0 15px 0;
      color: #aaa;
      font-size: 0.9rem;
    }
    .btn-remove {
      background-color: #cf6679;
      color: #000;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-remove:hover { background-color: #b33951; color: #fff; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Meeting Space</h1>
    <a href="p8.html" class="back-btn">← Back to Directory</a>
  </div>

  <div id="empty-state" style="display: none;">
    <p>No one has been invited to the meeting yet.</p>
  </div>

  <div id="meeting-container"></div>
  
  <script src="p8-meeting.js"></script>
</body>
</html>
