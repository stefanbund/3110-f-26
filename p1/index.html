<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic JavaScript - JSON Parsing</title>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    h1 {
      color: #bb86fc;
    }
    p {
      font-size: 1.2rem;

    .instruction {

    }

      background-color: #2c2c2c;
      padding: 4px 8px;
      border-radius: 4px;
      color: #03dac6;
    }

</head>
<body>
  <h1>JavaScript JSON Parsing Project</h1>
  <div class="instruction">
    <p>The JavaScript code is running in the background.</p>
    <p>Please open the <strong>Developer Console</strong> in your Chrome browser to view the formatted customer data.</p>
    <p><small>(Shortcut: <code>Cmd + Option + J</code> on Mac or <code>Ctrl + Shift + J</code> on Windows)</small></p>
  </div>
  
  <!-- Include the JavaScript file -->
  <script src="script.js"></script>
