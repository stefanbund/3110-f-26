<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App 4 - Delete & State Updates</title>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 40px;
    }
    h1 {
      color: #bb86fc;
      text-align: center;
    }
    .instruction {
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #333;
      margin-bottom: 30px;
      text-align: center;
    }
    
    /* Form Styling */
    .form-container {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto 30px auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .form-container h2 {
      grid-column: 1 / -1;
      margin-top: 0;
      color: #03dac6;
      font-size: 1.2rem;
    }
    .input-group {
      display: flex;
      flex-direction: column;
    }
    .input-group label {
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #b0b0b0;
    }
    .input-group input, .input-group select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background-color: #2c2c2c;
      color: #fff;
    }
    .add-btn {
      grid-column: 1 / -1;
      padding: 12px;
      background-color: #bb86fc;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }
    .add-btn:hover {
      background-color: #9965f4;
    }

    /* Customer Cards */
    #customer-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 800px;
      margin: 0 auto;
    }
    .customer-card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      position: relative; /* Allows absolute positioning for the delete button */
    }
    .customer-card h3 {
      margin: 0 0 10px 0;
      color: #03dac6;
      font-size: 1.4rem;
    }
    .customer-card p {
      margin: 5px 0;
      color: #b0b0b0;
    }
    .customer-card .status {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: bold;
    }
    .status-active { background-color: #1b5e20; color: #a5d6a7; }
    .status-inactive { background-color: #b71c1c; color: #ef9a9a; }
    .status-pending { background-color: #f57f17; color: #fff59d; }

    /* New Delete Button Style */
    .delete-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: #cf6679;
      color: #000;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .delete-btn:hover {
      background-color: #b33951;
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>Customer Directory App</h1>
  <div class="instruction">
    <p>Version 4: You can now Add AND Delete customers. Watch the UI re-render instantly when the array updates!</p>
  </div>
  
  <!-- The Form Control Area -->
  <div class="form-container">
    <h2>Add New Customer</h2>
    
    <div class="input-group">
      <label>Customer ID</label>
      <input type="text" id="inputId" placeholder="CUST-006">
    </div>
    <div class="input-group">
      <label>Status</label>
      <select id="inputStatus">
        <option value="Active">Active</option>
        <option value="Pending">Pending</option>
        <option value="Inactive">Inactive</option>
      </select>
    </div>
    
    <div class="input-group">
      <label>First Name</label>
      <input type="text" id="inputFirstName" placeholder="Jane">
    </div>
    <div class="input-group">
      <label>Last Name</label>
      <input type="text" id="inputLastName" placeholder="Doe">
    </div>
    
    <div class="input-group">
      <label>Email</label>
      <input type="email" id="inputEmail" placeholder="jane@example.com">
    </div>
    <div class="input-group">
      <label>Phone</label>
      <input type="text" id="inputPhone" placeholder="555-0199">
    </div>

    <div class="input-group">
      <label>Address</label>
      <input type="text" id="inputAddress" placeholder="123 Main St">
    </div>
    <div class="input-group">
      <label>City</label>
      <input type="text" id="inputCity" placeholder="Los Angeles">
    </div>

    <div class="input-group">
      <label>State</label>
      <input type="text" id="inputState" placeholder="CA">
    </div>
    <div class="input-group">
      <label>Zip Code</label>
      <input type="text" id="inputZipCode" placeholder="90001">
    </div>

    <button class="add-btn" onclick="addCustomer()">Add Customer to Array</button>
  </div>

  <!-- Container for the dynamic list -->
  <div id="customer-container"></div>
  
  <script src="app4.js"></script>
</body>
</html>
